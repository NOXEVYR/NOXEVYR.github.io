name: Sync projects and deploy personal website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: personal-website-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public project releases
        # Preserve a reviewed live catalog snapshot for targeted product updates.
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[catalog-only]')
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build static website
        run: node scripts/build.mjs --production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-production
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
